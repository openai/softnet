[package]
name = "softnet"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
path = "lib/mod.rs"

[profile.release-with-debug]
inherits = "release"
debug = true

[dependencies]
smoltcp = "0"
etherparse = "0.21"
libc = "0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "signal", "time", "macros", "io-util"] }
tokio-util = { version = "0.7.19", features = ["join-map", "codec"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dhcproto = { git = "https://github.com/bluecatengineering/dhcproto.git", branch = "master" }
hickory-server = { version = "0.26.1", default-features = false }
vmnet = "0.10.0"
clap = { version = "4", features = ["derive"] }
mac_address = "1"
privdrop = "0"
anyhow = { version = "1", features = ["backtrace"] }
async-trait = "0.1"
thiserror = "2"
ip_network = "0"
uzers = "0"
system-configuration = "0"
sentry = { version = "0", features = ["debug-images"] }
sentry-anyhow = { version = "0", features = ["backtrace"] }
nix = { version = "0", features = ["fs", "socket"] }
network-interface = "2"
prefix-trie = "0"
ipnet = "2"
rand = "0.10"
oslog = "0.2.0"
log = "0.4.29"
serial_test = "4"
coarsetime = "0.1.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonrpsee-types = "0.26"
uuid = { version = "1", features = ["v7"] }
unix-ancillary = { version = "0.6.1", features = ["tokio"] }

[profile.release]
debug = true
